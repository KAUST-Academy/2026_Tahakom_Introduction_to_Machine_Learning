# =============================================================================
# Introduction to Machine Learning — course content
# Phase 1 of the Tahakom AI Early Careers Program.
#
# This file is the single source of truth for the website. Edit it, run
# `python3 build.py --check`, and every page is regenerated. Never edit the
# generated HTML in _site/ — it is deleted and rebuilt every time.
#
# Resource `status`:
#   todo   -> renders greyed out as "Coming soon", not linked, not checked.
#   ready  -> renders as a button; `file` must exist or --check fails the build.
#
# Material comes from Tahakom_Early_Careers/Phase_1_Introduction_to_Machine_Learning,
# with the same file names, so a deck or notebook updated there can be copied
# straight over. Each day's Lectures/ is Slides/Day_N/, its Labs/ is
# Labs/Day_N/, and its Optional/ material sits in an Optional/ subfolder of
# each.
# =============================================================================

[course]
title      = "Introduction to Machine Learning"
title_lead = "Introduction to"
title_rest = "Machine Learning"

tagline  = "Phase 1 of the Tahakom AI Early Careers Program: five days from evaluating a model to deploying one responsibly."
client   = "Tahakom"
provider = "KAUST Academy"
year     = "2026"

starts   = "TBC"
ends     = "TBC"
location = "KAUST"

# Drives the footer licence link and the Colab URL pattern below.
repo         = "KAUST-Academy/2026_Tahakom_Introduction_to_Machine_Learning"

license      = "GPL-3.0"
license_note = "Recording and uploading lectures online is not permitted."

summary = """
A five-day foundation for every participant in the AI Early Careers Program.
It starts with how to build and honestly evaluate a model, moves through
neural networks, CNNs, RNNs and transformers, then reinforcement learning, and
closes with responsible AI and taking a model to production.
"""

# -----------------------------------------------------------------------------
# Days
#
# Each day is 6 hours of contact time: two lecture blocks and two lab blocks.
# Rows marked "Optional" are extension material, not taught in the 6 hours.
#
# Colab URLs: https://colab.research.google.com/github/<repo>/blob/main/<path>
# with the path percent-encoded (`&` is %26, `(` and `)` are %28 and %29).
# -----------------------------------------------------------------------------

[[days]]
slug  = "day1"
label = "Day 1"
title = "Model Development, Evaluation, and Experimentation"
blurb = "Framing a problem, validating a model honestly, choosing the right metric, and preparing data without leakage."
icon  = "ri-bar-chart-box-line"

  [[days.resources]]
  name   = "Data Science Foundations"
  detail = "Generalization, overfitting, validation strategy, metrics, hyperparameters, and a practical modelling workflow"
