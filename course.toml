  file   = "Slides/Day_1/01_Data_Science_Foundations.pdf"
  status = "ready"

  [[days.resources]]
  name   = "Data Preprocessing"
  detail = "Scaling, encoding, pipelines and information leakage, feature selection and engineering, missing values, imbalanced data"
